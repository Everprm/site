<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Вход в систему учета склада</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a3c5e 0%, #2a5f7a 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .login-container {
            background: white;
            padding: 40px 35px;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 420px;
        }
        .login-container h1 {
            color: #1a3c5e;
            text-align: center;
            margin-bottom: 5px;
            font-size: 28px;
        }
        .login-container .subtitle {
            text-align: center;
            color: #888;
            font-size: 14px;
            margin-bottom: 25px;
        }
        .form-group {
            margin-bottom: 18px;
        }
        .form-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 5px;
            color: #333;
            font-size: 14px;
        }
        .form-group input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            transition: 0.3s;
        }
        .form-group input:focus {
            border-color: #1a3c5e;
            outline: none;
            box-shadow: 0 0 0 3px rgba(26, 60, 94, 0.2);
        }
        .btn-login {
            width: 100%;
            padding: 14px;
            background: #1a3c5e;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 5px;
        }
        .btn-login:hover {
            background: #0f2a40;
        }
        .btn-login:disabled {
            background: #aaa;
            cursor: not-allowed;
        }
        .error-msg {
            background: #ffebee;
            color: #c62828;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 18px;
            display: none;
            font-size: 14px;
            text-align: center;
        }
        .error-msg.show {
            display: block;
        }
        
        /* Список пользователей */
        .users-list {
            margin-top: 22px;
            padding-top: 18px;
            border-top: 2px solid #eee;
        }
        .users-list .label {
            font-size: 13px;
            color: #888;
            text-align: center;
            margin-bottom: 10px;
        }
        .user-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
        }
        .user-item {
            background: #f5f7fa;
            padding: 8px 10px;
            border-radius: 6px;
            text-align: center;
            font-size: 14px;
            color: #333;
            border: 1px solid #e9ecef;
        }
        .user-item .name {
            font-weight: 600;
            color: #1a3c5e;
        }
        .user-item .role-badge {
            display: inline-block;
            font-size: 10px;
            background: #1a3c5e;
            color: white;
            padding: 1px 8px;
            border-radius: 10px;
            margin-left: 4px;
        }
        .user-item .role-badge.worker {
            background: #6c757d;
        }
        .user-item .role-badge.admin {
            background: #d32f2f;
        }
        
        .footer-login {
            text-align: center;
            margin-top: 18px;
            color: #bbb;
            font-size: 12px;
        }
    </style>
</head>
<body>
<div class="login-container">
    <h1>📦 Склад</h1>
    <p class="subtitle">Введите логин и пароль для входа</p>
    
    <div id="errorMsg" class="error-msg">❌ Неверный логин или пароль</div>
    
    <form id="loginForm" onsubmit="return login(event)">
        <div class="form-group">
            <label for="username">👤 Логин</label>
            <input type="text" id="username" placeholder="Введите имя пользователя" required autofocus>
        </div>
        <div class="form-group">
            <label for="password">🔒 Пароль</label>
            <input type="password" id="password" placeholder="Введите пароль" required>
        </div>
        <button type="submit" class="btn-login" id="loginBtn">Войти</button>
    </form>
    
    <div class="users-list">
        <div class="label">— Доступные пользователи —</div>
        <div class="user-grid">
            <div class="user-item"><span class="name">Павел</span> <span class="role-badge admin">админ</span></div>
            <div class="user-item"><span class="name">Валерий</span> <span class="role-badge worker">клад.</span></div>
            <div class="user-item"><span class="name">Евгений</span> <span class="role-badge worker">клад.</span></div>
            <div class="user-item"><span class="name">Виталий</span> <span class="role-badge worker">клад.</span></div>
        </div>
    </div>
    
    <div class="footer-login">Автоматизированная система учета склада</div>
</div>

<script>
    async function login(event) {
        event.preventDefault();
        
        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value;
        const errorDiv = document.getElementById('errorMsg');
        const btn = document.getElementById('loginBtn');
        
        if (!username || !password) {
            errorDiv.textContent = '❌ Заполните все поля!';
            errorDiv.classList.add('show');
            return false;
        }
        
        btn.disabled = true;
        btn.textContent = '⏳ Вход...';
        errorDiv.classList.remove('show');
        
        try {
            const resp = await fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });
            
            const result = await resp.json();
            
            if (result.status === 'OK') {
                window.location.href = '/';
            } else {
                errorDiv.textContent = '❌ ' + result.error;
                errorDiv.classList.add('show');
                btn.disabled = false;
                btn.textContent = 'Войти';
            }
        } catch (e) {
            errorDiv.textContent = '❌ Ошибка соединения с сервером';
            errorDiv.classList.add('show');
            btn.disabled = false;
            btn.textContent = 'Войти';
        }
        
        return false;
    }
    
    document.getElementById('password').addEventListener('keydown', function(e) {
        if (e.key === 'Enter') {
            document.getElementById('loginForm').dispatchEvent(new Event('submit'));
        }
    });
</script>
</body>
</html>
